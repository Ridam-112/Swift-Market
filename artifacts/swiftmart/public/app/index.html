<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SwiftMart - Hyperlocal Quick Commerce App for Balurghat. Fast delivery of groceries, fresh vegetables, sweets, snacks, and daily essentials.">
  <meta name="theme-color" content="#f59e0b">
  <meta name="google-signin-client_id" content="556854517102-ueq0udfe68n3es3i6hquc1hu6lefgtuc.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SwiftMart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SwiftMart — Fast Hyperlocal Delivery Balurghat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Loading indicator while Flutter engine initializes */
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a162b 0%, #0d0d12 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .loading-logo {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(245, 158, 11, 0.3);
      animation: pulse 1.8s infinite ease-in-out;
    }
    .loading-spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fbbf24;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Desktop bar if accessed on PC */
    #desktop-bar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #18181b;
      color: #e4e4e7;
      z-index: 10000;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    @media (min-width: 768px) {
      #desktop-bar {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="desktop-bar">
    <span>📱 SwiftMart Mobile App Preview</span>
    <a href="/?view=desktop" style="color: #f59e0b; text-decoration: none; font-weight: bold;">Switch to Desktop Web Site &rarr;</a>
  </div>

  <div id="flutter-loading">
    <img class="loading-logo" src="icons/Icon-192.png" alt="SwiftMart" onerror="this.style.display='none'">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading SwiftMart...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('flutter-loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
